<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Analog Slider API Update</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<h2>Tune PID Coefficient Values</h2>
			<div class="value-display" id="KpValue">15</div>
			<label for="Kp">P:</label>
			<input
				type="range"
				min="0"
				max="30"
				value="15"
				class="slider"
				id="Kp"
			/>
			<div class="value-display" id="KiValue">0</div>
			<label for="Ki">I:</label>
			<input
				type="range"
				min="0"
				max="1"
				value="0"
				step="0.01"
				class="slider"
				id="Ki"
			/>
			<div class="value-display" id="KdValue">0</div>
			<label for="Kd">D:</label>
			<input
				type="range"
				min="0"
				max="10"
				value="0"
				step="0.05"
				class="slider"
				id="Kd"
			/>
			<h2>Other Parameters</h2>
			<label for="MotorEnable">Motor Enable:</label>
			<input type="checkbox" id="motorEnable" checked />
			<div class="value-display" id="rpmValue">20</div>
			<label for="rpm">RPM:</label>
			<input
				type="range"
				min="0"
				max="1500"
				value="20"
				step="1"
				class="slider"
				id="rpm"
			/>
			<h2>Aim</h2>
			<div class="value-display" id="angleValue">0&deg;</div>
			<div
				class="dial"
				id="angleDial"
				role="slider"
				aria-label="Aim angle"
				aria-valuemin="0"
				aria-valuemax="360"
				aria-valuenow="0"
				tabindex="0"
			>
				<div class="dial-tick"></div>
				<div class="dial-handle dial-handle-encoder" id="encoderHandle"></div>
				<div class="dial-handle" id="angleHandle"></div>
			</div>
			<div class="value-display" id="encoderAngleValue">0&deg;</div>
			<label>Encoder (AS5600):</label>

			<div class="status" id="statusMessage">Ready</div>
		</div>

		<div>
			<h2>State</h2>
			<div>Kp: <span id="KpState"></span></div>
			<div>Ki <span id="KiState"></span></div>
			<div>Kd: <span id="KdState"></span></div>
			<div>motor enable: <span id="motorEnableState"></span></div>
			<div>rpm: <span id="rpmState"></span></div>
			<div>angle: <span id="angleState"></span></div>
			<div>encoder angle: <span id="encoderAngleState"></span></div>
		</div>
		<script type="text/javascript" src="code.js"></script>
	</body>
</html>

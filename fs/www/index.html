<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Analog Slider API Update</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<h2>Aim</h2>
			<div class="control">
				<div class="control-row">
					<label>Azimuth:</label>
					<div class="value-display" id="angleValue">0&deg;</div>
				</div>
				<div
					class="dial"
					id="angleDial"
					role="slider"
					aria-label="Aim angle"
					aria-valuemin="0"
					aria-valuemax="360"
					aria-valuenow="0"
					tabindex="0"
				>
					<div class="dial-tick"></div>
					<div class="dial-handle dial-handle-encoder" id="encoderHandle"></div>
					<div class="dial-handle" id="angleHandle"></div>
				</div>
				<div class="control-row">
					<label>Actual:</label>
					<div class="value-display" id="encoderAngleValue">0&deg;</div>
				</div>
			</div>

			<div class="control">
				<div class="control-row">
					<label for="pitch">Pitch:</label>
					<div class="value-display" id="pitchValue">0&deg;</div>
				</div>
				<input
					type="range"
					min="0"
					max="180"
					value="0"
					step="1"
					class="slider"
					id="pitch"
				/>
				<div class="control-row">
					<label>Actual:</label>
					<div class="value-display" id="pitchActualValue">0&deg;</div>
				</div>
				<div class="status" id="pitchStatus"></div>
			</div>

			<div class="control">
				<div class="control-row">
					<label for="auto_fire">Auto-fire:</label>
					<input type="checkbox" id="auto_fire" />
				</div>
				<button type="button" class="fire-button" id="triggerButton">
					Hold to Fire
				</button>
			</div>

			<div class="status" id="statusMessage">Ready</div>

			<button type="button" class="advanced-toggle" id="advancedToggle">
				Show Advanced
			</button>

			<div class="advanced" id="advancedControls" hidden>
				<h2>Azimuth P/I/D</h2>
				<div class="control">
					<div class="control-row">
						<label for="Kp">P:</label>
						<div class="value-display" id="KpValue">2.5</div>
					</div>
					<input
						type="range"
						min="0"
						max="3"
						value="2.5"
						step="0.02"
						class="slider"
						id="Kp"
					/>
				</div>
				<div class="control">
					<div class="control-row">
						<label for="Ki">I:</label>
						<div class="value-display" id="KiValue">2.0</div>
					</div>
					<input
						type="range"
						min="0"
						max="5"
						value="2.0"
						step="0.02"
						class="slider"
						id="Ki"
					/>
				</div>
				<div class="control">
					<div class="control-row">
						<label for="Kd">D:</label>
						<div class="value-display" id="KdValue">0.2</div>
					</div>
					<input
						type="range"
						min="0"
						max="1"
						value="0.2"
						step="0.01"
						class="slider"
						id="Kd"
					/>
				</div>

				<h2>Pitch P/I/D</h2>
				<div class="control">
					<div class="control-row">
						<label for="PitchKp">P:</label>
						<div class="value-display" id="PitchKpValue">2.5</div>
					</div>
					<input
						type="range"
						min="0"
						max="3"
						value="2.5"
						step="0.02"
						class="slider"
						id="PitchKp"
					/>
				</div>
				<div class="control">
					<div class="control-row">
						<label for="PitchKi">I:</label>
						<div class="value-display" id="PitchKiValue">2.0</div>
					</div>
					<input
						type="range"
						min="0"
						max="5"
						value="2.0"
						step="0.02"
						class="slider"
						id="PitchKi"
					/>
				</div>
				<div class="control">
					<div class="control-row">
						<label for="PitchKd">D:</label>
						<div class="value-display" id="PitchKdValue">0.2</div>
					</div>
					<input
						type="range"
						min="0"
						max="1"
						value="0.2"
						step="0.01"
						class="slider"
						id="PitchKd"
					/>
				</div>
			</div>
		</div>

		<script type="text/javascript" src="code.js"></script>
	</body>
</html>
